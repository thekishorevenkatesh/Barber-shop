<!DOCTYPE html>
<html lang="kn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cutting Shop — 90s & early 2000s Kannada hits from your neighbourhood barbershop." />
    <title>ಕ್ಷೌರದ ಅಂಗಡಿ</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#171009" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/player-extras.css" />
  </head>
  <body>
    <div class="wallpaper" aria-hidden="true"></div><div class="overlay" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
    <main class="app">
      <header class="top-bar">
        <div class="brand"><span class="brand-icon" aria-hidden="true">✂</span><h1>ಕ್ಷೌರದ ಅಂಗಡಿ</h1></div>
        <div class="online-pill"><span class="online-dot" aria-hidden="true"></span>90s radio</div>
      </header>
      <p class="eyebrow">EST. 1997</p>
      <footer class="player" id="player-shell" aria-label="Music player">
        <button class="island-summary" id="player-toggle" type="button" aria-expanded="false" aria-controls="player-details">
          <span class="mini-art"><img id="mini-cover" src="" alt="" /></span><span class="mini-meta"><strong id="mini-title">Loading…</strong><small id="mini-artist"></small></span><span class="equalizer" aria-hidden="true"><i></i><i></i><i></i></span><span class="mini-play" aria-hidden="true"><svg id="mini-icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5z"/></svg><svg id="mini-icon-pause" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></span>
        </button>
        <div class="player-details" id="player-details"><button id="minimize-btn" class="minimize-btn" type="button" aria-label="Minimize player"><span></span></button>
          <div class="progress-wrap"><span id="current-time" class="time">0:00</span><input class="progress-bar" id="progress-bar" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek through current song" /><span id="duration" class="time">0:00</span></div>
          <div class="controls"><button id="prev-btn" class="control-btn" type="button" aria-label="Previous song"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z"/></svg></button><button id="play-btn" class="control-btn play-btn" type="button" aria-label="Play"><svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5z"/></svg><svg id="icon-pause" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button><button id="next-btn" class="control-btn" type="button" aria-label="Next song"><svg viewBox="0 0 24 24"><path d="M16 18h2V6h-2v12zm-11-7 8.5-6v12L5 11z"/></svg></button><button id="volume-btn" class="control-btn" type="button" aria-label="Show volume controls" aria-expanded="false"><svg id="icon-volume" viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6l-5 4H3zm12.5 2c0-1.2-.7-2.3-1.7-2.8v5.6c1-.5 1.7-1.6 1.7-2.8zM14 3.2v2.1c2.3.8 4 3 4 5.7s-1.7 4.9-4 5.7v2.1c3.4-.9 6-4 6-7.8s-2.6-6.9-6-7.8z"/></svg><svg id="icon-muted" class="hidden" viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6l-5 4H3zm11.6 2 2.4 2.4 2.4-2.4 1.4 1.4-2.4 2.4 2.4 2.4-1.4 1.4-2.4-2.4-2.4 2.4-1.4-1.4 2.4-2.4-2.4-2.4 1.4-1.4z"/></svg></button></div>
          <label class="volume-wrap" id="volume-wrap" for="volume-slider"><span>VOLUME</span><input id="volume-slider" type="range" min="0" max="100" value="75" aria-label="Volume" /></label>
          <div class="player-footer"><p id="player-status" class="player-status" role="status">Loading player…</p></div>
        </div>
      </footer>
    </main>
    <div id="yt-player" class="yt-hidden" aria-hidden="true"></div>
    <script src="data/playlist.js"></script><script src="js/player.js"></script><script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js?v=5");</script>
  </body>
</html>
